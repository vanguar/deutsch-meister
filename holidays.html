<body data-reader-dir="data/holidays/">

<div class="bg-mesh"></div>
<main class="news-page hd-page" id="libView">
  <header class="news-head">
    <a class="news-back" href="index.html">← Главная</a>
    <div class="news-titles hd-titles">
      <div class="hd-eyebrow" lang="de" dir="ltr"><span aria-hidden="true">✦</span> Feste und Bräuche</div>
      <h1 class="news-h1">Праздники и традиции</h1>
    </div>
    <button class="news-btn" data-lang-toggle onclick="I18N.toggle()" title="Язык · Мова" aria-label="Язык · Мова">RU</button>
    <button class="news-btn" id="themeToggle" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему">🌙</button>
  </header>
  <p class="news-intro hd-intro">Праздники Германии, Австрии и Швейцарии. Выберите дату, чтобы узнать, что и как отмечают.</p>

  <div class="hd-layout" id="holidayCalendar" aria-busy="true">
    <section class="hd-month" aria-labelledby="holidayMonth">
      <div class="hd-toolbar">
        <h2 id="holidayMonth" aria-live="polite">Календарь</h2>
        <div class="hd-nav">
          <button class="news-btn" type="button" id="holidayToday">Сегодня</button>
          <button class="news-btn hd-arrow" type="button" data-month-step="-1" aria-label="Предыдущий месяц"><span aria-hidden="true">‹</span></button>
          <button class="news-btn hd-arrow" type="button" data-month-step="1" aria-label="Следующий месяц"><span aria-hidden="true">›</span></button>
        </div>
      </div>
      <ul class="hd-week" id="holidayWeek" aria-hidden="true"></ul>
      <ol class="hd-days" id="holidayDays"></ol>
    </section>
    <section class="hd-agenda" aria-labelledby="holidayAgenda">
      <h2 id="holidayAgenda">Даты месяца</h2>
      <p class="hd-status" id="holidayStatus" role="status">Загружаем календарь…</p>
      <button class="news-btn" type="button" id="holidayRetry" hidden>Повторить</button>
      <button class="news-btn" type="button" id="holidayNextDate" hidden>К ближайшей дате</button>
      <ul class="hd-list" id="holidayList"></ul>
    </section>
  </div>
</main>

<div id="readerShell" data-back-label="К календарю"></div>
