name: Validate lessons

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate lesson data, shells and cache versions
        run: python scripts/validate_lessons.py
      - name: Dialogs (data, translations, photos)
        run: python scripts/validate_dialogs.py
      - name: Fahrschule (word tips, translations, signs)
        run: python scripts/validate_fahrschule.py
      - name: Validate Laender (Земли Германии)
        run: python scripts/validate_laender.py && python scripts/validate_books.py --laender
      - name: Fahrschule build checks (junction solver, source errors)
        run: python tools/fahrschule/test_build.py
      - name: Audience wording (Russian UI is not Russia)
        run: python scripts/test_audience_wording.py
      - name: Cloud progress merge (server never loses progress)
        run: python scripts/test_progress_merge.py
