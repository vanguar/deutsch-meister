name: Validate lessons

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate lesson data, shells and cache versions
        run: python scripts/validate_lessons.py
      - name: Audience wording (Russian UI is not Russia)
        run: python scripts/test_audience_wording.py
